server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yieldgrain}
    username: ${DB_USERNAME:yieldgrain}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

otp:
  provider: twilio

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

logging:
  level:
    org.springframework.security: INFO
    com.yieldgrain: DEBUG
